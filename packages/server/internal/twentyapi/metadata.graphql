scalar UUID
scalar DateTime
scalar JSON

schema {
  query: Query
  mutation: Mutation
}

type Query {
  getPublicWorkspaceDataByDomain(origin: String): PublicWorkspaceData!
  checkUserExists(email: String!, captchaToken: String): CheckUserExist!
  currentUser: User!
  minimalMetadata: MinimalMetadata!
  objects(paging: CursorPaging): ObjectConnection!
  getViews(objectMetadataId: String, viewTypes: [ViewType!]): [View!]!
  frontComponents: [FrontComponent!]!
  findManyLogicFunctions: [LogicFunction!]!
  navigationMenuItems: [NavigationMenuItem!]!
  commandMenuItems: [CommandMenuItem!]!
}

type CommandMenuItem {
  id: UUID!
  applicationId: String
  workflowVersionId: UUID
  frontComponentId: UUID
  frontComponent: FrontComponent
  engineComponentKey: String
  label: String
  icon: String
  shortLabel: String
  position: Float
  isPinned: Boolean
  payload: CommandMenuItemPayload
  hotKeys: [String!]
  conditionalAvailabilityExpression: String
  availabilityType: String
  availabilityObjectMetadataId: UUID
  pageLayoutId: UUID
  isActive: Boolean!
}

union CommandMenuItemPayload = PathCommandMenuItemPayload | ObjectMetadataCommandMenuItemPayload

type PathCommandMenuItemPayload {
  path: String
}

type ObjectMetadataCommandMenuItemPayload {
  objectMetadataItemId: UUID
}

type FrontComponent {
  id: UUID!
  name: String!
  applicationId: String
  builtComponentChecksum: String
  builtComponentPath: String
  componentName: String
  createdAt: DateTime!
  description: String
  isHeadless: Boolean!
  sourceComponentPath: String
  universalIdentifier: String
  updatedAt: DateTime!
  usesSdkClient: Boolean!
}

type LogicFunction {
  id: UUID!
  name: String!
  description: String
  runtime: String
  timeoutSeconds: Float
  executionMode: String
  sourceHandlerPath: String
  handlerName: String
  cronTriggerSettings: JSON
  databaseEventTriggerSettings: JSON
  httpRouteTriggerSettings: JSON
  toolTriggerSettings: JSON
  workflowActionTriggerSettings: JSON
  applicationId: String
  universalIdentifier: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NavigationMenuItem {
  id: UUID!
  type: String!
  userWorkspaceId: UUID
  targetRecordId: UUID
  targetObjectMetadataId: UUID
  viewId: UUID
  folderId: UUID
  name: String
  link: String
  icon: String
  color: String
  pageLayoutId: UUID
  position: Float
  applicationId: String
  createdAt: DateTime!
  updatedAt: DateTime!
  targetRecordIdentifier: NavigationTargetRecordIdentifier
}

type NavigationTargetRecordIdentifier {
  id: UUID!
  labelIdentifier: String
  imageIdentifier: String
}

enum ViewType {
  TABLE
  KANBAN
  CALENDAR
  FIELDS_WIDGET
  TABLE_WIDGET
}

type View {
  id: UUID!
  name: String!
  objectMetadataId: UUID!
  type: ViewType!
  key: String
  icon: String
  position: Float!
  isCompact: Boolean!
  openRecordIn: String
  kanbanAggregateOperation: String
  kanbanAggregateOperationFieldMetadataId: UUID
  mainGroupByFieldMetadataId: UUID
  shouldHideEmptyGroups: Boolean!
  anyFieldFilterValue: String
  calendarFieldMetadataId: UUID
  calendarLayout: String
  visibility: String
  createdByUserWorkspaceId: UUID
  isActive: Boolean!
  viewFields: [ViewField!]!
  viewFieldGroups: [ViewFieldGroup!]!
  viewFilters: [ViewFilter!]!
  viewFilterGroups: [ViewFilterGroup!]!
  viewSorts: [ViewSort!]!
  viewGroups: [ViewGroup!]!
}

type ViewField {
  id: UUID!
  fieldMetadataId: UUID!
  viewId: UUID!
  isVisible: Boolean!
  position: Float!
  size: Float!
  aggregateOperation: String
  viewFieldGroupId: UUID
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type ViewFieldGroup {
  id: UUID!
  name: String!
  position: Float!
  isVisible: Boolean!
  viewId: UUID!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  viewFields: [ViewField!]!
}

type ViewFilter {
  id: UUID!
  fieldMetadataId: UUID!
  operand: String!
  value: JSON
  viewFilterGroupId: UUID
  positionInViewFilterGroup: Float
  subFieldName: String
  relationTargetFieldMetadataId: UUID
  viewId: UUID!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type ViewFilterGroup {
  id: UUID!
  parentViewFilterGroupId: UUID
  logicalOperator: String!
  positionInViewFilterGroup: Float
  viewId: UUID!
}

type ViewSort {
  id: UUID!
  fieldMetadataId: UUID!
  direction: String!
  subFieldName: String
  viewId: UUID!
  createdAt: DateTime!
  deletedAt: DateTime
  updatedAt: DateTime!
}

type ViewGroup {
  id: UUID!
  isVisible: Boolean!
  fieldValue: String!
  position: Float!
  viewId: UUID!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

input CursorPaging {
  first: Int
  after: String
  last: Int
  before: String
}

type ObjectConnection {
  edges: [ObjectEdge!]!
  pageInfo: PageInfo!
}

type ObjectEdge {
  node: Object!
}

type PageInfo {
  hasNextPage: Boolean
  hasPreviousPage: Boolean
  startCursor: String
  endCursor: String
}

type Object {
  id: UUID!
  universalIdentifier: String
  nameSingular: String!
  namePlural: String!
  labelSingular: String!
  labelPlural: String!
  color: String
  description: String
  icon: String
  isCustom: Boolean!
  isRemote: Boolean!
  isActive: Boolean!
  isSystem: Boolean!
  isUIEditable: Boolean!
  isUICreatable: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  labelIdentifierFieldMetadataId: UUID
  imageIdentifierFieldMetadataId: UUID
  applicationId: String
  shortcut: String
  isLabelSyncedWithName: Boolean!
  isSearchable: Boolean!
  duplicateCriteria: JSON
  indexMetadataList: [IndexMetadata!]!
  fieldsList: [Field!]!
}

type IndexMetadata {
  id: UUID!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  indexWhereClause: String
  indexType: String!
  isUnique: Boolean!
  isCustom: Boolean!
  indexFieldMetadataList: [IndexFieldMetadata!]!
}

type IndexFieldMetadata {
  id: UUID!
  fieldMetadataId: UUID!
  subFieldName: String
  createdAt: DateTime!
  updatedAt: DateTime!
  order: Int!
}

type Field {
  id: UUID!
  universalIdentifier: String
  type: String!
  name: String!
  label: String!
  description: String
  icon: String
  isCustom: Boolean!
  isActive: Boolean!
  isSystem: Boolean!
  isUIEditable: Boolean!
  isNullable: Boolean!
  isUnique: Boolean
  createdAt: DateTime!
  updatedAt: DateTime!
  defaultValue: JSON
  options: JSON
  settings: JSON
  isLabelSyncedWithName: Boolean!
  morphId: String
  applicationId: String
  relation: FieldRelation
  morphRelations: [FieldRelation!]!
}

type FieldRelation {
  type: String!
  sourceObjectMetadata: RelationObjectRef!
  targetObjectMetadata: RelationObjectRef!
  sourceFieldMetadata: RelationFieldRef!
  targetFieldMetadata: RelationFieldRef!
}

type RelationObjectRef {
  id: UUID!
  nameSingular: String!
  namePlural: String!
}

type RelationFieldRef {
  id: UUID!
  name: String!
}

type MinimalMetadata {
  objectMetadataItems: [ObjectMetadataItemMinimal!]!
  views: [MinimalView!]!
  collectionHashes: [CollectionHash!]!
}

type ObjectMetadataItemMinimal {
  id: UUID!
  nameSingular: String!
  namePlural: String!
  labelSingular: String!
  labelPlural: String!
  icon: String
  isCustom: Boolean!
  isActive: Boolean!
  isSystem: Boolean!
  isRemote: Boolean!
}

type MinimalView {
  id: UUID!
  type: String!
  key: String
  objectMetadataId: UUID!
}

type CollectionHash {
  collectionName: String!
  hash: String!
}

type CheckUserExist {
  exists: Boolean!
  availableWorkspacesCount: Float!
  isEmailVerified: Boolean!
}

type Mutation {
  getLoginTokenFromCredentials(email: String!, password: String!, captchaToken: String, locale: String, verifyEmailRedirectPath: String, origin: String!): LoginToken!
  getAuthTokensFromLoginToken(loginToken: String!, origin: String!): AuthTokens!
  trackAnalytics(type: AnalyticsType!, name: String, event: String, properties: JSON): Analytics!
}

type PublicWorkspaceData {
  id: UUID!
  authProviders: AuthProviders!
  authBypassProviders: AuthBypassProviders
  logo: String
  displayName: String
  workspaceUrls: WorkspaceUrls!
}

type AuthProviders {
  sso: [SSOIdentityProvider!]!
  google: Boolean!
  magicLink: Boolean!
  password: Boolean!
  microsoft: Boolean!
}

type AuthBypassProviders {
  google: Boolean!
  password: Boolean!
  microsoft: Boolean!
}

type SSOIdentityProvider {
  id: String!
  name: String!
  type: String!
  status: String!
  issuer: String!
}

type WorkspaceUrls {
  customUrl: String
  subdomainUrl: String!
}

type AuthToken {
  token: String!
  expiresAt: DateTime!
}

type AuthTokenPair {
  accessOrWorkspaceAgnosticToken: AuthToken!
  refreshToken: AuthToken!
}

type LoginToken {
  loginToken: AuthToken!
}

type AuthTokens {
  tokens: AuthTokenPair!
}

type Analytics {
  success: Boolean!
}

enum AnalyticsType {
  PAGEVIEW
  TRACK
}

# ── currentUser graph ──
type User {
  id: UUID!
  firstName: String!
  lastName: String!
  email: String!
  hasPassword: Boolean!
  canAccessFullAdminPanel: Boolean!
  canImpersonate: Boolean!
  supportUserHash: String
  onboardingStatus: String
  workspaceMember: WorkspaceMember
  workspaceMembers: [WorkspaceMember!]!
  deletedWorkspaceMembers: [DeletedWorkspaceMember!]!
  currentUserWorkspace: UserWorkspace
  currentWorkspace: Workspace
  availableWorkspaces: AvailableWorkspaces!
  userVars: JSON
}

type FullName {
  firstName: String!
  lastName: String!
}

type WorkspaceMember {
  id: UUID!
  name: FullName!
  colorScheme: String!
  avatarUrl: String
  locale: String
  userEmail: String!
  userWorkspaceId: UUID
  timeZone: String
  dateFormat: String
  timeFormat: String
  calendarStartDay: Int
  numberFormat: String
}

type DeletedWorkspaceMember {
  id: UUID!
  name: FullName!
  avatarUrl: String
  userEmail: String!
}

type UserWorkspace {
  id: UUID!
  permissionFlags: [String!]!
  objectsPermissions: [ObjectPermission!]!
  twoFactorAuthenticationMethodSummary: [TwoFactorAuthenticationMethodSummary!]!
}

type TwoFactorAuthenticationMethodSummary {
  twoFactorAuthenticationMethodId: String!
  status: String!
  strategy: String!
}

type ObjectPermission {
  objectMetadataId: UUID!
  canReadObjectRecords: Boolean
  canUpdateObjectRecords: Boolean
  canSoftDeleteObjectRecords: Boolean
  canDestroyObjectRecords: Boolean
  restrictedFields: JSON
  rowLevelPermissionPredicates: [RowLevelPermissionPredicate!]!
  rowLevelPermissionPredicateGroups: [RowLevelPermissionPredicateGroup!]!
}

type RowLevelPermissionPredicate {
  id: String!
  fieldMetadataId: String!
  objectMetadataId: String!
  operand: String!
  subFieldName: String
  workspaceMemberFieldMetadataId: String
  workspaceMemberSubFieldName: String
  rowLevelPermissionPredicateGroupId: String
  positionInRowLevelPermissionPredicateGroup: Float
  roleId: String!
  value: JSON
}

type RowLevelPermissionPredicateGroup {
  id: String!
  parentRowLevelPermissionPredicateGroupId: String
  logicalOperator: String!
  positionInRowLevelPermissionPredicateGroup: Float
  roleId: String!
  objectMetadataId: String!
}

type Workspace {
  id: UUID!
  displayName: String
  logo: String
  inviteHash: String
  allowImpersonation: Boolean!
  activationStatus: String!
  isPublicInviteLinkEnabled: Boolean!
  isGoogleAuthEnabled: Boolean!
  isMicrosoftAuthEnabled: Boolean!
  isPasswordAuthEnabled: Boolean!
  isGoogleAuthBypassEnabled: Boolean!
  isMicrosoftAuthBypassEnabled: Boolean!
  isPasswordAuthBypassEnabled: Boolean!
  subdomain: String!
  customDomain: String
  hasValidSignedEnterpriseKey: Boolean!
  hasValidEnterpriseValidityToken: Boolean!
  workspaceCustomApplication: Application
  installedApplications: [Application!]!
  isCustomDomainEnabled: Boolean!
  workspaceUrls: WorkspaceUrls!
  featureFlags: [FeatureFlag!]!
  metadataVersion: Float!
  currentBillingSubscription: BillingSubscription
  billingSubscriptions: [BillingSubscription!]!
  billingEntitlements: [BillingEntitlement!]!
  workspaceMembersCount: Float
  defaultRole: Role
  fastModel: String
  smartModel: String
  aiAdditionalInstructions: String
  enabledAiModelIds: [String!]!
  useRecommendedModels: Boolean!
  isTwoFactorAuthenticationEnforced: Boolean!
  trashRetentionDays: Float
  eventLogRetentionDays: Float
  editableProfileFields: [String!]!
  isInternalMessagesImportEnabled: Boolean!
}

type Application {
  id: UUID!
  name: String!
  universalIdentifier: String!
  logo: String
}

type FeatureFlag {
  key: String!
  value: Boolean!
}

type BillingEntitlement {
  key: String!
  value: Boolean!
}

type Role {
  id: UUID!
  label: String!
  description: String
  icon: String
  canUpdateAllSettings: Boolean!
  canAccessAllTools: Boolean!
  isEditable: Boolean!
  canReadAllObjectRecords: Boolean!
  canUpdateAllObjectRecords: Boolean!
  canSoftDeleteAllObjectRecords: Boolean!
  canDestroyAllObjectRecords: Boolean!
  canBeAssignedToUsers: Boolean!
  canBeAssignedToAgents: Boolean!
  canBeAssignedToApiKeys: Boolean!
}

type AvailableWorkspaces {
  availableWorkspacesForSignIn: [AvailableWorkspace!]!
  availableWorkspacesForSignUp: [AvailableWorkspace!]!
}

type AvailableWorkspace {
  id: UUID!
  displayName: String
  loginToken: String
  inviteHash: String
  personalInviteToken: String
  workspaceUrls: WorkspaceUrls!
  logo: String
  sso: [SSOConnection!]!
}

type SSOConnection {
  type: String!
  id: UUID!
  issuer: String!
  name: String!
  status: String!
}

type BillingSubscription {
  id: UUID!
  status: String!
  interval: String
  metadata: JSON
  currentPeriodEnd: Float
  phases: [BillingSubscriptionSchedulePhase!]!
  billingSubscriptionItems: [BillingSubscriptionItem!]!
}

type BillingSubscriptionSchedulePhase {
  start_date: Float
  end_date: Float
  items: [BillingSubscriptionSchedulePhaseItem!]!
}

type BillingSubscriptionSchedulePhaseItem {
  price: String
  quantity: Float
}

type BillingSubscriptionItem {
  id: UUID!
  hasReachedCurrentPeriodCap: Boolean!
  quantity: Float
  stripePriceId: String
  billingProduct: BillingProduct
}

type BillingProduct {
  name: String!
  description: String!
  images: [String!]!
  metadata: BillingProductMetadata
}

type BillingProductMetadata {
  productKey: String
  planKey: String
  priceUsageBased: String
}
