enum PageLayoutType { RECORD_INDEX RECORD_PAGE DASHBOARD STANDALONE_PAGE }

type PageLayout {
  id: UUID!
  name: String!
  objectMetadataId: UUID
  type: String!
  universalIdentifier: String
  defaultTabToFocusOnMobileAndSidePanelId: UUID
  createdAt: DateTime!
  updatedAt: DateTime!
  tabs: [PageLayoutTab!]!
}

type PageLayoutTab {
  id: UUID!
  applicationId: String
  title: String!
  icon: String
  position: Float!
  layoutMode: String!
  widgets: [PageLayoutWidget!]!
  pageLayoutId: UUID!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PageLayoutWidget {
  id: UUID!
  applicationId: String
  title: String!
  type: String!
  objectMetadataId: UUID
  createdAt: DateTime!
  updatedAt: DateTime!
  isActive: Boolean!
  deletedAt: DateTime
  conditionalDisplay: Boolean
  conditionalAvailabilityExpression: String
  gridPosition: WidgetGridPosition!
  position: PageLayoutWidgetPosition
  configuration: PageLayoutWidgetConfiguration
  pageLayoutTabId: UUID!
}

type WidgetGridPosition { column: Float row: Float columnSpan: Float rowSpan: Float }
type RatioAggregateConfig { fieldMetadataId: String optionValue: String }
type StandaloneRichTextBody { blocknote: String markdown: String }

union PageLayoutWidgetPosition = PageLayoutWidgetGridPosition | PageLayoutWidgetVerticalListPosition | PageLayoutWidgetCanvasPosition
type PageLayoutWidgetGridPosition {
  layoutMode: String
  row: String
  column: String
  rowSpan: String
  columnSpan: String
}
type PageLayoutWidgetVerticalListPosition {
  layoutMode: String
  index: String
}
type PageLayoutWidgetCanvasPosition {
  layoutMode: String
}
union PageLayoutWidgetConfiguration = BarChartConfiguration | LineChartConfiguration | PieChartConfiguration | AggregateChartConfiguration | IframeConfiguration | StandaloneRichTextConfiguration | CalendarConfiguration | EmailsConfiguration | EmailThreadConfiguration | FieldConfiguration | FieldRichTextConfiguration | FieldsConfiguration | FilesConfiguration | NotesConfiguration | TasksConfiguration | TimelineConfiguration | ViewConfiguration | RecordTableConfiguration | WorkflowConfiguration | WorkflowRunConfiguration | WorkflowVersionConfiguration | FrontComponentConfiguration
