  secondaryAxisOrderBy: String
  secondaryAxisManualSortOrder: String
  omitNullValues: String
  axisNameDisplay: String
  displayDataLabel: String
  displayLegend: String
  rangeMin: String
  rangeMax: String
  color: String
  description: String
  filter: String
  groupMode: String
  layout: String
